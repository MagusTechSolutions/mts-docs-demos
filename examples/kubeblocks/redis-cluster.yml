apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: demo-redis
  namespace: demo
spec:
  clusterDef: redis
  topology: standalone
  terminationPolicy: DoNotTerminate
  componentSpecs:
    - name: redis
      componentDef: redis
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 256Mi
      volumeClaimTemplates:
        - name: data
          spec:
            storageClassName: truenas-nfs
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

