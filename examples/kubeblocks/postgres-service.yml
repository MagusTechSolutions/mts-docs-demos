apiVersion: v1
kind: Service
metadata:
  name: demo-db
  namespace: demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: demo-db
    apps.kubeblocks.io/component-name: postgresql
    kubeblocks.io/role: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

