apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: demo-db
  namespace: demo
spec:
  clusterDef: postgresql
  topology: replication
  terminationPolicy: DoNotTerminate
  componentSpecs:
    - name: postgresql
      componentDef: postgresql
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      volumeClaimTemplates:
        - name: data
          spec:
            storageClassName: truenas-nfs
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

