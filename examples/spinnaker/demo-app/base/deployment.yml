apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${appname}
  labels:
    app: ${appname}
    project: demo
  annotations:
    strategy.spinnaker.io/versioned: "true"
    strategy.spinnaker.io/max-version-history: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${appname}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${appname}
        project: demo
    spec:
      containers:
        - name: ${appname}
          image: app-image
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

